<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Exaktiv email signature</title>
<!--
  How to use (ASD-STE100):
  1. Host the banner PNGs on the Exaktiv domain (decision D1). Replace YOUR-DOMAIN below.
  2. Replace the three [placeholders]. The signature names the sender; the site never does (PRD-W §2).
  3. Open this file in a browser, select the signature table, copy it, and paste it into the
     signature settings of the mail client.
  Email clients do not load web fonts, so text uses Georgia and Arial as fallbacks. The banner is an
  image at 2x resolution, shown at 600 x 150 px (or 600 x 64 px for the strip).
-->
</head>
<body style="margin:0;padding:24px;background:#ffffff;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#15140F;">
  <tr>
    <td style="padding:0 0 4px 0;font-family:Georgia,'Times New Roman',serif;font-size:18px;line-height:1.3;color:#15140F;">[Name]</td>
  </tr>
  <tr>
    <td style="padding:0 0 12px 0;font-size:13px;line-height:1.5;color:#57544A;">[Role] · Exaktiv · <a href="mailto:[name]@YOUR-DOMAIN" style="color:#2443E6;text-decoration:underline;">[name]@YOUR-DOMAIN</a></td>
  </tr>
  <tr>
    <td style="padding:0;">
      <a href="https://YOUR-DOMAIN/" style="text-decoration:none;border:0;">
        <img src="https://YOUR-DOMAIN/brand/email/exaktiv-email-banner-paper@2x.png" width="600" height="150" alt="Exaktiv. AI you can audit. Legacy modernisation and AI product delivery." style="display:block;width:600px;max-width:100%;height:auto;border:0;">
      </a>
    </td>
  </tr>
  <tr>
    <td style="padding:10px 0 0 0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:12px;line-height:1.5;color:#57544A;">Exaktiv is a brand of Valyrian Tech Pvt Ltd.</td>
  </tr>
</table>
</body>
</html>
