[project]
name = "exaktiv-core"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2", "pydantic-settings", "asyncpg", "boto3", "psycopg[binary]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exaktiv_core"]
