[project]
name = "exaktiv-site-form"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "exaktiv-core",
    "fastapi",
    "uvicorn",
    "httpx",
    "email-validator",
    "alembic",
    "sqlalchemy[asyncio]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exaktiv_site_form"]
